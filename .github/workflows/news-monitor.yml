name: news-monitor

on:
  workflow_dispatch:              # 외부 스케줄러(cron-job.org)가 호출하는 방식
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'check'
        type: choice
        options: [check, digest]

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 모드 결정 (외부 호출 input 사용)
        id: mode
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          echo "mode=${INPUT_MODE:-check}" >> "$GITHUB_OUTPUT"

      - name: 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DIGEST_BOT_TOKEN: ${{ secrets.TELEGRAM_DIGEST_BOT_TOKEN }}
          TELEGRAM_DIGEST_CHAT_ID: ${{ secrets.TELEGRAM_DIGEST_CHAT_ID }}
        run: python news_monitor.py ${{ steps.mode.outputs.mode }}

      - name: DB 변경사항 커밋 (다음 실행에서 중복 방지용)
        run: |
          git config user.name "news-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news_monitor.db
          git diff --cached --quiet && exit 0
          git commit -m "update db [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push 실패, 재시도 ($i/5)..."
            sleep $((RANDOM % 10 + 5))
          done
