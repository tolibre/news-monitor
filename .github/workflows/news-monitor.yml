name: news-monitor

on:
  workflow_dispatch:              # 외부 스케줄러(cron-job.org)가 호출하는 방식
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'check'
        type: choice
        options: [check, digest, excluded]

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 모드 결정 (외부 호출 input 사용)
        id: mode
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          echo "mode=${INPUT_MODE:-check}" >> "$GITHUB_OUTPUT"

      - name: 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DIGEST_BOT_TOKEN: ${{ secrets.TELEGRAM_DIGEST_BOT_TOKEN }}
          TELEGRAM_DIGEST_CHAT_ID: ${{ secrets.TELEGRAM_DIGEST_CHAT_ID }}
        run: python news_monitor.py ${{ steps.mode.outputs.mode }}

      - name: DB 변경사항 커밋 (다음 실행에서 중복 방지용)
        run: |
          git config user.name "news-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news_monitor.db
          git diff --cached --quiet && exit 0
          git commit -m "update db [skip ci]"
          # 재시도 루프의 종료코드는 마지막 sleep의 것(=0)이라, 5번 다 실패해도
          # 워크플로가 초록불로 성공 표시됐다. DB가 저장소에 안 올라가도 아무도 모르는
          # 침묵 실패. pushed 플래그로 실제 성공 여부를 추적해 실패 시 빨간불을 낸다.
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              pushed=1
              break
            fi
            # rebase가 중단된 상태로 남으면 다음 시도가 무조건 실패하므로 정리
            git rebase --abort 2>/dev/null || true
            echo "push 실패, 재시도 ($i/5)..."
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::DB push 5회 모두 실패 — news_monitor.db가 저장소에 반영되지 않았습니다."
            exit 1
          fi
