name: news-monitor

on:
  workflow_dispatch:              # 외부 스케줄러(cron-job.org)가 호출하는 방식
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'check'
        type: choice
        options: [check, digest, excluded, backfill, retitle]
      apply:
        description: 'retitle 전용: 1이면 복구한 제목을 실제로 DB에 기록. 비우면 드라이런(전→후만 출력, DB 미변경).'
        required: false
        default: ''
        type: string
      limit:
        description: 'retitle 전용: 최근 수집분부터 N건만 처리(시험용). 비우면 대상 전체(수천 건, 오래 걸림 — check/digest가 대기열에 쌓임).'
        required: false
        default: ''
        type: string
      duty:
        description: '당직 출입처 강제 (1=8개 전체 / "산업부,중기부" 형태로 일부만). 비우면 DUTY_DATES 날짜 기준.'
        required: false
        default: ''
        type: string
      since:
        description: 'backfill 시작 시각 (예: 2026-08-20 20:00). 비우면 어제 20:00.'
        required: false
        default: ''
        type: string
      until:
        description: 'backfill 종료 시각. 비우면 지금.'
        required: false
        default: ''
        type: string
      groups:
        description: 'backfill 대상 그룹 (예: 산업부,중기부,개인정보위). 비우면 기본값.'
        required: false
        default: ''
        type: string
      page_mode:
        description: 'digest 전용: off(전문만, 페이지 없음) / both(전문+페이지, 전환 시작값) / summary(요약 카드+페이지). 비우면 off.'
        required: false
        default: 'off'
        type: choice
        options: [off, both, summary]
      force_send:
        description: 'digest 전용, 수동 테스트용: 1이면 토요일 발송 스킵을 무시하고 강제 발송(PAGE_MODE 등 확인용). 비우면 평소처럼 토요일 스킵.'
        required: false
        default: ''
        type: string

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 모드 결정 (외부 호출 input 사용)
        id: mode
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          echo "mode=${INPUT_MODE:-check}" >> "$GITHUB_OUTPUT"

      - name: 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DIGEST_BOT_TOKEN: ${{ secrets.TELEGRAM_DIGEST_BOT_TOKEN }}
          TELEGRAM_DIGEST_CHAT_ID: ${{ secrets.TELEGRAM_DIGEST_CHAT_ID }}
          # cron-job.org가 보내는 body에는 이 값이 없어 빈 문자열이 된다.
          # 즉 정기 실행(*/30 check)은 항상 DUTY_DATES 날짜 기준으로 동작한다.
          DUTY_MODE: ${{ github.event.inputs.duty }}
          BF_SINCE: ${{ github.event.inputs.since }}
          BF_UNTIL: ${{ github.event.inputs.until }}
          BF_GROUPS: ${{ github.event.inputs.groups }}
          # retitle 전용. 비우면 드라이런(기본값) — news_monitor.py에는 없는 스위치이므로
          # 다른 모드에선 그냥 무시된다.
          APPLY: ${{ github.event.inputs.apply }}
          LIMIT: ${{ github.event.inputs.limit }}
          # digest 전용 HTML 페이지 전환 스위치(D 세션, claude/HTML전환_세션계획.md 참조).
          # digest가 아닌 모드에서는 news_monitor.py가 아예 읽지 않으므로 무해하다.
          PAGE_MODE: ${{ github.event.inputs.page_mode }}
          # GitHub Pages 공개 URL. Settings → Pages에서 "Deploy from a branch:
          # main / docs"로 한 번 켜면 이 주소가 된다(레포명이 news-monitor이므로 고정값).
          PAGE_BASE_URL: https://tolibre.github.io/news-monitor
          # 토요일 발송 스킵을 수동으로 우회하는 테스트 전용 스위치. cron-job.org
          # body에는 이 값이 없어 항상 빈 문자열이므로 정기 실행의 토요일 스킵은 그대로다.
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" = "backfill" ]; then
            ARGS=""
            [ -n "$BF_GROUPS" ] && ARGS="--groups $BF_GROUPS"
            if [ -n "$BF_SINCE" ]; then
              if [ -n "$BF_UNTIL" ]; then
                python backfill.py $ARGS "$BF_SINCE" "$BF_UNTIL"
              else
                python backfill.py $ARGS "$BF_SINCE"
              fi
            else
              python backfill.py $ARGS
            fi
          elif [ "$MODE" = "retitle" ]; then
            python retitle.py
          else
            python news_monitor.py "$MODE"
          fi

      - name: DB·페이지 변경사항 커밋 (다음 실행에서 중복 방지용 + GitHub Pages 갱신)
        # backfill은 DB를 건드리지 않으므로 커밋 단계를 통째로 건너뛴다.
        # (불필요한 git 왕복은 동시 실행 시 push 경합 위험만 늘린다)
        # docs/index.html은 PAGE_MODE=off(기본값)나 digest가 아닌 모드에서는 애초에
        # 생성되지 않으므로, add -f 없이도 파일이 없으면 git add가 조용히 무시한다.
        if: steps.mode.outputs.mode != 'backfill'
        run: |
          git config user.name "news-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news_monitor.db
          [ -f docs/index.html ] && git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "update db/page [skip ci]"
          # 재시도 루프의 종료코드는 마지막 sleep의 것(=0)이라, 5번 다 실패해도
          # 워크플로가 초록불로 성공 표시됐다. DB가 저장소에 안 올라가도 아무도 모르는
          # 침묵 실패. pushed 플래그로 실제 성공 여부를 추적해 실패 시 빨간불을 낸다.
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              pushed=1
              break
            fi
            # rebase가 중단된 상태로 남으면 다음 시도가 무조건 실패하므로 정리
            git rebase --abort 2>/dev/null || true
            echo "push 실패, 재시도 ($i/5)..."
            sleep $((RANDOM % 10 + 5))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::DB push 5회 모두 실패 — news_monitor.db가 저장소에 반영되지 않았습니다."
            exit 1
          fi
