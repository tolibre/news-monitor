name: news-monitor

# 0-78 사전 측정 전용 임시 브랜치(claude/measure-newkw)의 워크플로 — main의 news-monitor.yml과 무관.
# workflow_dispatch(ref=이 브랜치)로 한 번 돌리고 브랜치째 지운다. DB는 읽기만, 결과는 이 브랜치에만 커밋.
on:
  workflow_dispatch:
    inputs:
      mode:
        required: false
        default: 'measure'
        type: string

concurrency:
  group: news-monitor-measure
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 측정
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python measure_newkw.py
      - name: 결과 커밋(이 브랜치에만)
        run: |
          git config user.name "news-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add measure/out.json
          git commit -m "measure: 0-78 new keyword probe [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
