name: news-monitor

on:
  schedule:
    # GitHub 자체 스케줄 (보조 — 돌면 좋고, 안 돌아도 외부 스케줄러가 커버)
    - cron: '*/15 * * * *'       # 15분마다 → check 모드
    - cron: '30 23 * * *'        # UTC 23:30 = KST 08:30 → digest(오전)
    - cron: '30 4 * * *'         # UTC 04:30 = KST 13:30 → digest(오후)
  workflow_dispatch:              # 수동/외부 스케줄러 호출용
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'check'
        type: choice
        options: [check, digest]

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 모드 결정 (외부 호출 input 우선, 없으면 cron 스케줄로 판단)
        id: mode
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "30 23 * * *" ] || [ "$SCHED" = "30 4 * * *" ]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=check" >> "$GITHUB_OUTPUT"
          fi

      - name: 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_monitor.py ${{ steps.mode.outputs.mode }}

      - name: DB 변경사항 커밋 (다음 실행에서 중복 방지용)
        run: |
          git config user.name "news-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news_monitor.db
          git diff --cached --quiet || git commit -m "update db [skip ci]"
          git push
